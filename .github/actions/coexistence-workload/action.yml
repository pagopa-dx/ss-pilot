name: Exercise controlled combined runtime security
description: Run the same DX-aligned fixture and validate positive/native controls.
runs:
  using: composite
  steps:
    - name: Verify detector before bootstrap
      if: ${{ env.PILOT_DETECTOR == 'enabled' }}
      shell: bash
      run: |
        set -euo pipefail
        id="$(python3 -c 'import json, os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "ss-pilot-falco-owner.json").read_text())["id"])')"
        [[ "$(docker inspect --format '{{.State.Running}}' "$id")" == true ]] || { echo "::error::Falco is not running"; exit 1; }
    - name: Bootstrap controlled Node fixture
      uses: ./.github/actions/node-build-bootstrap
    - name: Start independent DNS capture
      shell: bash
      run: bash .github/scripts/runtime-dns-capture.sh start "$PILOT_DIR"
    - name: Run the legitimate build and controlled dependency request
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$PILOT_DETECTOR" == enabled ]]; then
          id="$(python3 -c 'import json, os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "ss-pilot-falco-owner.json").read_text())["id"])')"
          [[ "$(docker inspect --format '{{.State.Running}}' "$id")" == true ]] || { echo "::error::Falco is not running"; exit 1; }
        fi
        bash .github/scripts/node-build-workload.sh "$PILOT_MODE" "$PILOT_DIR"
    - name: Trigger a harmless detectable process
      shell: bash
      run: |
        python3 -c 'import json, os, sys; print(json.dumps({"pid": os.getpid(), "marker": sys.argv[1]}))' \
          ss-pilot-controlled-marker > "$PILOT_DIR/marker.json"
    - name: Capture StepSecurity native evidence
      if: ${{ always() && env.PILOT_FIREWALL == 'enabled' }}
      shell: bash
      run: bash .github/scripts/collect-node-evidence.sh stepsecurity "$PILOT_DIR"
    - name: Stop independent DNS capture
      if: ${{ always() && env.PILOT_CAPTURE_PID != '' }}
      shell: bash
      run: bash .github/scripts/runtime-dns-capture.sh stop "$PILOT_DIR"
    - name: Verify the build and expected Falco marker
      if: always()
      shell: bash
      run: python3 .github/scripts/coexistence_verify.py --directory "$PILOT_DIR" --mode "$PILOT_MODE" --detector "$PILOT_DETECTOR"
    - name: Verify StepSecurity native block evidence
      if: ${{ always() && env.PILOT_FIREWALL == 'enabled' }}
      shell: bash
      run: python3 .github/scripts/verify_node_build.py --tool stepsecurity --mode "$PILOT_MODE" --directory "$PILOT_DIR"
    - name: Preserve the controlled pre-cleanup evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coexistence-${{ env.PILOT_CASE }}-${{ github.run_attempt }}
        path: ${{ env.PILOT_DIR }}
        if-no-files-found: error
        retention-days: 7
