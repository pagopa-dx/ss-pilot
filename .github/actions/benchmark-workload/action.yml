name: Exercise an isolated runtime guard
description: Run the common workload or one bounded fault without changing the host outside GitHub CI.
runs:
  using: composite
  steps:
    - name: Require an active guard before application execution
      if: ${{ env.BENCHMARK_KIND != 'startup-failure' }}
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py gate

    - name: Measure build and exercise network coverage
      if: ${{ env.BENCHMARK_KIND == 'functional' || env.BENCHMARK_KIND == 'performance' }}
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py run

    - name: Inject guard process exit on this ephemeral runner
      if: ${{ env.BENCHMARK_KIND == 'agent-exit' || env.BENCHMARK_KIND == 'agent-exit-during' }}
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py fault

    - name: Exercise targeted coverage or controlled telemetry comparison
      if: ${{ startsWith(env.BENCHMARK_KIND, 'gap-') || env.BENCHMARK_KIND == 'privacy' }}
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py run

    - name: Inject workload timeout
      if: ${{ env.BENCHMARK_KIND == 'timeout' }}
      id: deadline
      continue-on-error: true
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        import os
        import subprocess
        import time
        root = Path(os.environ["PILOT_DIR"])
        root.joinpath("fault-waiting.json").write_text(json.dumps({"started_at": time.time()}))
        child = subprocess.Popen(["sleep", "30"])
        try:
            child.wait(timeout=2)
            raise SystemExit("::error::Timeout fixture ended before its deadline")
        except subprocess.TimeoutExpired:
            child.terminate()
            child.wait(timeout=5)
            root.joinpath("timeout.json").write_text(json.dumps({
                "status": "timeout", "child_pid": child.pid,
                "returncode": child.returncode, "finished_at": time.time()
            }))
            print("Bounded child deadline expired; child terminated and reaped.")
        PY

    - name: Wait for an externally requested GitHub job cancellation
      if: ${{ env.BENCHMARK_KIND == 'cancellation' }}
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py wait
