name: Preserve benchmark evidence
description: Stop field-cage when still active, collect diagnostics and report harness completion explicitly.
runs:
  using: composite
  steps:
    - name: Collect native diagnostics
      if: always()
      shell: bash
      run: |
        mkdir -p "$PILOT_DIR"
        if [[ "$BENCHMARK_TOOL" != baseline ]]; then
          bash .github/scripts/collect-node-evidence.sh "$BENCHMARK_TOOL" "$PILOT_DIR"
        fi

    - name: Verify workload and retain machine-readable result
      if: always()
      shell: bash
      run: python3 .github/scripts/benchmark_runner.py finalize
