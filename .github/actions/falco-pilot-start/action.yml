name: Start isolated Falco detection control
description: Pilot control matching the detector portion of the combined action.
runs:
  using: composite
  steps:
    - name: Start the pilot Falco engine and register cleanup
      uses: pagopa-dx/ss-pilot/.github/actions/falco-lifecycle@839628daaa94c3e7c6e98593e2c69664025bc2ae
      with:
        rule-file: ${{ github.workspace }}/.github/actions/combined-runtime/pilot-rules.yaml
