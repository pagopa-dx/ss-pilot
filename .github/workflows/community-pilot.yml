name: Harden-Runner Community pilot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  community-audit:
    name: Community audit on GitHub-hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Generate harmless HTTPS traffic
        shell: bash
        run: |
          set -euo pipefail
          for url in https://example.com/ https://api.github.com/zen; do
            curl --proto '=https' --tlsv1.2 \
              --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 --retry 2 \
              --output /dev/null \
              --write-out "Requested ${url}: HTTP %{http_code}\n" \
              "$url"
          done

      - name: Record workload and verification checklist
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Community audit pilot

          The HTTPS workload completed on GitHub-hosted Ubuntu.
          No checkout, repository secrets, or authenticated workload requests are used.

          | Workload endpoint | Expected port |
          | --- | --- |
          | example.com | 443 |
          | api.github.com | 443 |

          **A green job is not evidence that monitoring worked.**
          Open the security insights link emitted by Harden-Runner in its logs or
          job summary after the job completes. Verify that it refers to this run
          and job, and that both endpoints appear under the
          `Generate harmless HTTPS traffic` step.

          Record the run URL, insights URL, observed endpoints, and any monitoring
          or access errors. If insights cannot be inspected, the pilot remains
          unverified. Audit still enforces StepSecurity's Global Block List.
          EOF

  community-block:
    name: Community block on GitHub-hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443

      - name: Verify allowed HTTPS traffic
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 \
            --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 2 \
            --output /dev/null \
            --write-out "Allowed https://api.github.com/zen: HTTP %{http_code}\n" \
            https://api.github.com/zen

      - name: Verify disallowed HTTPS traffic fails
        shell: bash
        run: |
          set -euo pipefail
          if curl --proto '=https' --tlsv1.2 \
            --silent --show-error \
            --connect-timeout 10 --max-time 15 \
            --output /dev/null \
            --write-out "Disallowed https://example.com/: HTTP %{http_code}\n" \
            https://example.com/; then
            echo "::error::example.com is outside the allowlist but remained reachable."
            exit 1
          else
            result=$?
            case "$result" in
              6|7|28)
                echo "Expected transport failure for example.com: curl exit ${result}."
                ;;
              *)
                echo "::error::Unexpected curl failure ${result}; inspect the logs."
                exit 1
                ;;
            esac
          fi

      - name: Record block verification checklist
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Community block pilot with telemetry disabled

          | Workload endpoint | Policy | Request outcome |
          | --- | --- | --- |
          | api.github.com:443 | Allowed | HTTPS request succeeded |
          | example.com:443 | Outside allowlist | Transport failure observed |

          **A curl failure alone is not proof of enforcement.**
          After Harden-Runner's post step completes, inspect its agent logs
          for a block event for example.com:443.
          Confirm that api.github.com:443 remains allowed and that example.com:443
          is reachable in the separate audit job of this same run.

          Harden-Runner is configured with disable-telemetry: true for this
          block job only. Check its effective configuration and telemetry
          message; do not expect this job's network events in the dashboard.
          The audit job still sends telemetry. This flag does not make the
          action offline: setup and control-plane API requests may remain.

          This tests a custom allowlist with harmless destinations, not malicious
          domains or the Global Block List. No secrets or PR code are used.
          EOF
