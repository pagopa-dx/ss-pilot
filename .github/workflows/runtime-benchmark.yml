name: Comprehensive runtime benchmark

on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: full

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
      guards: ${{ steps.plan.outputs.guards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        env:
          PROFILE: ${{ inputs.profile }}
        run: python3 .github/scripts/benchmark_runner.py plan --profile "$PROFILE"

  baseline:
    if: ${{ inputs.profile != 'cancellation' }}
    needs: plan
    name: Benchmark baseline ${{ matrix.kind }} ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.baseline) }}
    env:
      PILOT_DIR: /tmp/runtime-benchmark
      BENCHMARK_TOOL: baseline
      BENCHMARK_MODE: audit
      BENCHMARK_KIND: ${{ matrix.kind }}
      BENCHMARK_ITERATION: ${{ matrix.iteration }}
    steps:
      - name: Observe setup and cleanup independently
        if: always()
        uses: pagopa-dx/ss-pilot/.github/actions/benchmark-observer@d5e8897e7041df7657156091e71d3992e46116ef
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-build-bootstrap
      - uses: ./.github/actions/benchmark-workload
      - if: always()
        uses: ./.github/actions/benchmark-finish
        env:
          BENCHMARK_JOB_STATUS: ${{ job.status }}
      - name: Preserve the pre-post evidence snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-baseline-audit-${{ matrix.kind }}-${{ matrix.iteration }}-${{ github.run_attempt }}
          path: ${{ env.PILOT_DIR }}
          if-no-files-found: error
          retention-days: 7

  field-cage:
    needs: plan
    name: Benchmark field-cage ${{ matrix.mode }} ${{ matrix.kind }} ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'agent-exit' && 4 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.guards) }}
    env:
      PILOT_DIR: /tmp/runtime-benchmark
      BENCHMARK_TOOL: field-cage
      BENCHMARK_MODE: ${{ matrix.mode }}
      BENCHMARK_KIND: ${{ matrix.kind }}
      BENCHMARK_ITERATION: ${{ matrix.iteration }}
    steps:
      - name: Observe setup and cleanup independently
        if: always()
        uses: pagopa-dx/ss-pilot/.github/actions/benchmark-observer@d5e8897e7041df7657156091e71d3992e46116ef
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-build-bootstrap
      - name: Start field-cage or inject a missing release
        id: guard
        continue-on-error: ${{ matrix.kind == 'startup-failure' }}
        uses: takihito/field-cage@b43cc7fd609580579cf9f233dc654fa1119aa220 # v0.1.6
        with:
          version: ${{ matrix.kind == 'startup-failure' && 'v0.0.0-benchmark-missing' || 'v0.1.6' }}
          mode: ${{ matrix.mode }}
          allow: |
            registry.npmjs.org
            example.org
            httpbingo.org
            nodejs.org
            github.com
            *.github.com
            *.githubapp.com
            *.githubusercontent.com
            *.blob.core.windows.net
            *.trafficmanager.net
          log-file: ${{ env.PILOT_DIR }}/agent.log
      - name: Exercise a real GitHub step deadline
        if: ${{ matrix.kind == 'timeout' && steps.guard.outcome == 'success' }}
        id: deadline
        timeout-minutes: 1
        continue-on-error: true
        run: python3 .github/scripts/benchmark_runner.py wait
      - if: ${{ steps.guard.outcome == 'success' && matrix.kind != 'startup-failure' }}
        uses: ./.github/actions/benchmark-workload
      - name: Stop field-cage even after an injected fault
        if: ${{ always() && env.FC_PID != '' }}
        uses: takihito/field-cage/stop@b43cc7fd609580579cf9f233dc654fa1119aa220 # v0.1.6
      - if: always()
        uses: ./.github/actions/benchmark-finish
        env:
          BENCHMARK_GUARD_OUTCOME: ${{ steps.guard.outcome }}
          BENCHMARK_JOB_STATUS: ${{ job.status }}
          BENCHMARK_TIMEOUT_OUTCOME: ${{ steps.deadline.outcome }}
      - name: Preserve the pre-post evidence snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-field-cage-${{ matrix.mode }}-${{ matrix.kind }}-${{ matrix.iteration }}-${{ github.run_attempt }}
          path: ${{ env.PILOT_DIR }}
          if-no-files-found: error
          retention-days: 7

  cargowall:
    needs: plan
    name: Benchmark cargowall ${{ matrix.mode }} ${{ matrix.kind }} ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'agent-exit' && 4 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.guards) }}
    env:
      PILOT_DIR: /tmp/runtime-benchmark
      BENCHMARK_TOOL: cargowall
      BENCHMARK_MODE: ${{ matrix.mode }}
      BENCHMARK_KIND: ${{ matrix.kind }}
      BENCHMARK_ITERATION: ${{ matrix.iteration }}
    steps:
      - name: Observe setup and cleanup independently
        if: always()
        uses: pagopa-dx/ss-pilot/.github/actions/benchmark-observer@d5e8897e7041df7657156091e71d3992e46116ef
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-build-bootstrap
      - name: Start offline CargoWall or inject a missing binary
        id: guard
        continue-on-error: ${{ matrix.kind == 'startup-failure' }}
        uses: code-cargo/cargowall-action@e5ed6c46902e295d7a791a15564056e9a3d1aafb # v1.3.8, runtime v1.3.6
        with:
          mode: ${{ matrix.mode == 'block' && 'enforce' || 'audit' }}
          binary-path: ${{ matrix.kind == 'startup-failure' && '/tmp/ss-pilot-intentionally-missing-binary' || '' }}
          offline: true
          api-url: ""
          fail-on-unsupported: true
          skip-actions-api: true
          audit-summary: false
          allowed-hosts: |
            registry.npmjs.org:443
            example.org:443
            httpbingo.org:443
      - name: Exercise a real GitHub step deadline
        if: ${{ matrix.kind == 'timeout' && steps.guard.outcome == 'success' }}
        id: deadline
        timeout-minutes: 1
        continue-on-error: true
        env:
          BENCHMARK_GUARD_PID: ${{ steps.guard.outputs.pid }}
        run: python3 .github/scripts/benchmark_runner.py wait
      - if: ${{ steps.guard.outcome == 'success' && matrix.kind != 'startup-failure' }}
        uses: ./.github/actions/benchmark-workload
        env:
          BENCHMARK_GUARD_PID: ${{ steps.guard.outputs.pid }}
      - if: always()
        uses: ./.github/actions/benchmark-finish
        env:
          BENCHMARK_GUARD_PID: ${{ steps.guard.outputs.pid }}
          BENCHMARK_GUARD_OUTCOME: ${{ steps.guard.outcome }}
          BENCHMARK_JOB_STATUS: ${{ job.status }}
          BENCHMARK_TIMEOUT_OUTCOME: ${{ steps.deadline.outcome }}
      - name: Preserve the pre-post evidence snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-cargowall-${{ matrix.mode }}-${{ matrix.kind }}-${{ matrix.iteration }}-${{ github.run_attempt }}
          path: ${{ env.PILOT_DIR }}
          if-no-files-found: error
          retention-days: 7

  stepsecurity:
    needs: plan
    name: Benchmark stepsecurity ${{ matrix.mode }} ${{ matrix.kind }} ${{ matrix.iteration }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'agent-exit' && 4 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.guards) }}
    env:
      PILOT_DIR: /tmp/runtime-benchmark
      BENCHMARK_TOOL: stepsecurity
      BENCHMARK_MODE: ${{ matrix.mode }}
      BENCHMARK_KIND: ${{ matrix.kind }}
      BENCHMARK_ITERATION: ${{ matrix.iteration }}
    steps:
      - name: Observe setup and cleanup independently
        if: always()
        uses: pagopa-dx/ss-pilot/.github/actions/benchmark-observer@d5e8897e7041df7657156091e71d3992e46116ef
      - name: Start StepSecurity or inject an invalid policy
        id: guard
        continue-on-error: ${{ matrix.kind == 'startup-failure' }}
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ matrix.kind == 'startup-failure' && 'invalid-benchmark-policy' || matrix.mode }}
          disable-telemetry: ${{ matrix.mode == 'block' }}
          allowed-endpoints: >-
            nodejs.org:443
            registry.npmjs.org:443
            example.org:443
            httpbingo.org:443
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443
            *.trafficmanager.net:443
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: always()
        with:
          persist-credentials: false
      - if: ${{ steps.guard.outcome == 'success' && matrix.kind != 'startup-failure' }}
        uses: ./.github/actions/node-build-bootstrap
      - name: Exercise a real GitHub step deadline
        if: ${{ matrix.kind == 'timeout' && steps.guard.outcome == 'success' }}
        id: deadline
        timeout-minutes: 1
        continue-on-error: true
        run: python3 .github/scripts/benchmark_runner.py wait
      - if: ${{ steps.guard.outcome == 'success' && matrix.kind != 'startup-failure' }}
        uses: ./.github/actions/benchmark-workload
      - if: always()
        uses: ./.github/actions/benchmark-finish
        env:
          BENCHMARK_GUARD_OUTCOME: ${{ steps.guard.outcome }}
          BENCHMARK_JOB_STATUS: ${{ job.status }}
          BENCHMARK_TIMEOUT_OUTCOME: ${{ steps.deadline.outcome }}
      - name: Preserve the pre-post evidence snapshot
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-stepsecurity-${{ matrix.mode }}-${{ matrix.kind }}-${{ matrix.iteration }}-${{ github.run_attempt }}
          path: ${{ env.PILOT_DIR }}
          if-no-files-found: error
          retention-days: 7
