name: Experimental combined runtime action

on:
  pull_request:
    paths:
      - .github/actions/combined-runtime/**
      - .github/actions/coexistence-workload/**
      - .github/actions/falco-lifecycle/**
      - .github/actions/falco-pilot-start/**
      - .github/scripts/coexistence_verify.py
      - .github/scripts/test_coexistence.py
      - .github/scripts/test_falco_lifecycle.cjs
      - .github/workflows/combined-runtime-pilot.yml
      - .github/workflows/runtime-coexistence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test .github/scripts/test_falco_lifecycle.cjs
      - run: python3 -m unittest discover -s .github/scripts -p test_coexistence.py
      - name: Require the remote-action pin to match this implementation
        run: |
          git diff --exit-code bc8d0f2ea03bebc43ffa69b734f3f22fc48a37df -- \
            .github/actions/combined-runtime/action.yml \
            .github/actions/combined-runtime/pilot-rules.yaml \
            .github/actions/falco-lifecycle
          git diff --exit-code 7a69622ca5b5e530e9066a54731992b4a5984733 -- \
            .github/actions/falco-lifecycle

  remote-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Start pinned remote composite
        uses: pagopa-dx/ss-pilot/.github/actions/combined-runtime@bc8d0f2ea03bebc43ffa69b734f3f22fc48a37df
        with:
          egress-policy: block
          disable-telemetry: "true"
          allowed-endpoints: >-
            api.github.com:443 github.com:443
            *.githubusercontent.com:443 *.githubapp.com:443
            *.blob.core.windows.net:443 *.trafficmanager.net:443
            auth.docker.io:443 registry-1.docker.io:443
            *.docker.io:443 *.docker.com:443
      - name: Check allowed and denied traffic
        shell: bash
        run: |
          set -euo pipefail
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null https://api.github.com/zen
          if curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --output /dev/null https://example.com/; then
            echo "::error::Excluded destination remained reachable"
            exit 1
          else
            status=$?
            case "$status" in
              6|7|28) echo "Expected network failure: curl exit $status" ;;
              *) echo "::error::Unexpected curl error: $status"; exit 1 ;;
            esac
          fi
          for attempt in {1..10}; do
            if sudo grep -E '\[dns-request-dropped\].*domain=example\.com\.' /home/agent/agent.log; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Missing native StepSecurity DNS-denial evidence"
          exit 1
      - name: Check a new native Falco marker and detector liveness
        shell: bash
        run: |
          set -euo pipefail
          id="$(python3 -c 'import json, os; from pathlib import Path; print(json.loads(Path(os.environ["RUNNER_TEMP"], "ss-pilot-falco-owner.json").read_text())["id"])')"
          [[ "$(docker inspect --format '{{.State.Running}}' "$id")" == true ]]
          marker_pid="$(python3 -c 'import os; print(os.getpid())' ss-pilot-controlled-marker)"
          export PILOT_MARKER_PID="$marker_pid"
          for attempt in {1..15}; do
            if sudo cat /tmp/falco_events.json | python3 -c '
          import json, os, sys
          events = (json.loads(line) for line in sys.stdin if line.strip())
          match = any(e.get("rule") == "SS Pilot Controlled Process Marker" and
                      str(e.get("output_fields", {}).get("proc.pid")) == os.environ["PILOT_MARKER_PID"]
                      for e in events)
          sys.exit(0 if match else 1)
          '; then
              echo "Falco detected the controlled process PID $marker_pid"
              exit 0
            fi
            sleep 1
          done
          echo "::error::No matching native Falco marker"
          exit 1
