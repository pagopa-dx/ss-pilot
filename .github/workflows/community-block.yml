name: Harden-Runner direct IP diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit direct IP control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      example_ip: ${{ steps.resolve.outputs.example_ip }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: false

      - name: Resolve example.com IPv4
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          ip=$(python3 -c 'import ipaddress, socket; addresses = sorted({item[4][0] for item in socket.getaddrinfo("example.com", 443, socket.AF_INET, socket.SOCK_STREAM) if ipaddress.ip_address(item[4][0]).is_global}); assert addresses, "No public IPv4 address returned"; print(addresses[0])')
          echo "example_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Resolved example.com IPv4: $ip"

      - name: Verify direct HTTPS in audit
        env:
          EXAMPLE_IP: ${{ steps.resolve.outputs.example_ip }}
        shell: bash
        run: |
          set -euo pipefail
          curl --noproxy '*' --proto '=https' --tlsv1.2 \
            --resolve "example.com:443:$EXAMPLE_IP" \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            --write-out 'Audit example.com direct IP: remote=%{remote_ip} HTTP %{http_code}\n' \
            https://example.com/

  block:
    name: Block direct IP test
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-telemetry: false
          allowed-endpoints: >
            api.github.com:443

      - name: Verify allowed HTTPS traffic
        shell: bash
        run: |
          set -euo pipefail
          curl --noproxy '*' --proto '=https' --tlsv1.2 \
            --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            --write-out 'Allowed api.github.com: HTTP %{http_code}\n' \
            https://api.github.com/zen

      - name: Attempt direct HTTPS to disallowed IP
        env:
          EXAMPLE_IP: ${{ needs.audit.outputs.example_ip }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Attempting example.com over direct IPv4 $EXAMPLE_IP (DNS bypassed)"
          if curl --noproxy '*' --proto '=https' --tlsv1.2 \
            --resolve "example.com:443:$EXAMPLE_IP" \
            --silent --show-error --connect-timeout 10 --max-time 15 \
            --output /dev/null \
            --write-out 'Block example.com direct IP: remote=%{remote_ip} HTTP %{http_code}\n' \
            https://example.com/; then
            echo "::error::Direct HTTPS unexpectedly succeeded."
            exit 1
          else
            result=$?
            case "$result" in
              7|28)
                echo "Direct HTTPS transport failed: curl exit $result."
                ;;
              *)
                echo "::error::Unexpected curl error $result."
                exit 1
                ;;
            esac
          fi
